<!DOCTYPE html>
<html lang="es">

<head>
    <title>Welcome!</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            background: #f3f0e8;
            color: #241f1a;
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            min-height: 100vh;
            width: 900px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            border: 4px solid #2b2118;
        }

        .selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 2rem;
            border: 4px solid #2b2118;
        }

        .book {
            display: grid;
            grid-template-rows: auto auto;
            gap: 0.75rem;
            justify-items: center;
        }

        .cover-link {
            display: block;
            width: 150px;
            height: 230px;
            border: 3px solid #2b2118;
            background: #8a5a35;
            color: #fff8e8;
            text-decoration: none;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .cover-link:hover,
        .cover-link:focus {
            transform: scale(1.06);
            box-shadow: 0 12px 24px rgba(36, 31, 26, 0.25);
        }

        .cover-art {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 1rem;
            text-align: center;
            font-size: 1.15rem;
            line-height: 1.25;
        }

        .book-title {
            min-height: 2.5rem;
            margin: 0;
            text-align: center;
            font-size: 1rem;
            line-height: 1.25;
        }
    </style>
</head>

<body>
    <main>
        <div class="selection">
            <div class="book">
                <a class="cover-link" href="index.html" aria-label="Open Capitulo Uno">
                    <span class="cover-art">Cover Art</span>
                </a>
                <p class="book-title">Capitulo Uno</p>
            </div>
            <div class="book">
                <a class="cover-link" href="index.html" aria-label="Open Libro Dos">
                    <span class="cover-art">Cover Art</span>
                </a>
                <p class="book-title">Libro Dos</p>
            </div>
            <div class="book">
                <a class="cover-link" href="index.html" aria-label="Open Libro Tres">
                    <span class="cover-art">Cover Art</span>
                </a>
                <p class="book-title">Libro Tres</p>
            </div>
        </div>
    </main>
</body>

</html>
